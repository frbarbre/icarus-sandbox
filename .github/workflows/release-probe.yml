name: release probe

on:
  workflow_dispatch:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Old way (existing tag plus --target)
        continue-on-error: true
        run: |
          echo hello > probe.txt
          gh release create "$TAG" probe.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title old --generate-notes --latest
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
      - name: New way (existing tag, --verify-tag)
        run: |
          set -euo pipefail
          echo hello > probe.txt
          gh release create "$TAG" probe.txt --repo "$GITHUB_REPOSITORY" --verify-tag --title new --generate-notes --latest
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
